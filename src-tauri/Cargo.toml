[package]
name = "snipjoin"
version = "1.0.0"
description = "Snip a stretch out of any video, join what is left, and export it."
authors = ["Snip Join"]
edition = "2021"
rust-version = "1.77"
default-run = "snipjoin"

[lib]
# The Tauri mobile tooling expects the app to live in a cdylib-capable library crate.
name = "snipjoin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dunce = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
