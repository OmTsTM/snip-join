[package]
name = "snipjoin"
version = "1.1.4"
description = "Snip a stretch out of any video, join what is left, and export it."
authors = ["Snip Join"]
edition = "2021"
rust-version = "1.77"
default-run = "snipjoin"

[lib]
# An rlib and nothing else: main.rs links it, and so does the end-to-end test
# binary. The staticlib and cdylib the Tauri template adds are there for the
# iOS and Android tooling, which a Windows-only application never invokes.
# Building the cdylib also made every release link emit MSVC's "Creating
# library ... and object ..." notice on stdout, which rustc now reports as a
# warning under `linker_messages`.
name = "snipjoin_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "7"
# The update check, and nothing else. `native-tls` rather than a bundled stack:
# on Windows that is schannel and the machine's own certificate store, which is
# the same trust the user's browser would apply to the same download.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "charset"] }
# Verifying that an update was signed by this project's own key. Minisign is the
# same scheme Tauri's own updater uses, so the signatures the release workflow
# already produces are the ones this checks.
minisign-verify = "0.2"
# Unpacking a portable update. Deflate only: the archive this reads is the one
# this project's own packer writes, and the rest of the formats are weight.
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dunce = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
